<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 808" fill="none">
  <defs>
    <linearGradient id="pixelEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C7C80"/>
      <stop offset="20%" stop-color="#636366"/>
      <stop offset="50%" stop-color="#505054"/>
      <stop offset="80%" stop-color="#636366"/>
      <stop offset="100%" stop-color="#7C7C80"/>
    </linearGradient>
    <linearGradient id="pixelSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E6E73"/>
      <stop offset="15%" stop-color="#58585C"/>
      <stop offset="50%" stop-color="#48484C"/>
      <stop offset="85%" stop-color="#58585C"/>
      <stop offset="100%" stop-color="#6E6E73"/>
    </linearGradient>
    <linearGradient id="btnR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E6E73"/>
      <stop offset="40%" stop-color="#58585C"/>
      <stop offset="100%" stop-color="#48484C"/>
    </linearGradient>
  </defs>

  <!-- Aluminum frame -->
  <rect x="0" y="0" width="360" height="808" rx="40" ry="40" fill="url(#pixelSide)"/>
  <rect x="0" y="0" width="360" height="808" rx="40" ry="40" fill="url(#pixelEdge)" opacity="0.4"/>
  <rect x="2" y="2" width="356" height="804" rx="38" ry="38" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.5"/>

  <!-- Front glass -->
  <rect x="4" y="4" width="352" height="800" rx="36" ry="36" fill="#0A0A0C"/>

  <!-- Screen -->
  <rect x="14" y="32" width="332" height="744" rx="22" ry="22" fill="#000"/>

  <!-- Camera punch-hole -->
  <circle cx="180" cy="46" r="5" fill="#0A0A0C"/>
  <circle cx="180" cy="46" r="3" fill="#020204" stroke="#1A1A1C" stroke-width="0.3"/>

  <!-- Right buttons: power -->
  <rect x="356.5" y="218" width="5" height="50" rx="2" ry="2" fill="url(#btnR)"/>
  <!-- Volume -->
  <rect x="356.5" y="288" width="5" height="70" rx="2" ry="2" fill="url(#btnR)"/>
</svg>
