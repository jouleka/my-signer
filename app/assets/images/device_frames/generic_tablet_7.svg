<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" fill="none">
  <defs>
    <linearGradient id="tabEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C7C80"/>
      <stop offset="25%" stop-color="#636366"/>
      <stop offset="50%" stop-color="#545458"/>
      <stop offset="75%" stop-color="#636366"/>
      <stop offset="100%" stop-color="#7C7C80"/>
    </linearGradient>
    <linearGradient id="tabSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E6E73"/>
      <stop offset="15%" stop-color="#58585C"/>
      <stop offset="50%" stop-color="#48484C"/>
      <stop offset="85%" stop-color="#58585C"/>
      <stop offset="100%" stop-color="#6E6E73"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="0" y="0" width="400" height="640" rx="18" ry="18" fill="url(#tabSide)"/>
  <rect x="0" y="0" width="400" height="640" rx="18" ry="18" fill="url(#tabEdge)" opacity="0.4"/>
  <rect x="2" y="2" width="396" height="636" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.5"/>

  <!-- Front glass -->
  <rect x="5" y="5" width="390" height="630" rx="14" ry="14" fill="#0A0A0C"/>

  <!-- Screen -->
  <rect x="20" y="20" width="360" height="600" rx="8" ry="8" fill="#000"/>

  <!-- Front camera -->
  <circle cx="200" cy="10" r="2.5" fill="#1C1C1E"/>
</svg>
