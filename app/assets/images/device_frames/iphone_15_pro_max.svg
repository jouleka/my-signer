<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" fill="none">
  <defs>
    <linearGradient id="titaniumEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#787880"/>
      <stop offset="20%" stop-color="#636366"/>
      <stop offset="50%" stop-color="#545456"/>
      <stop offset="80%" stop-color="#636366"/>
      <stop offset="100%" stop-color="#787880"/>
    </linearGradient>
    <linearGradient id="titaniumSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E6E73"/>
      <stop offset="15%" stop-color="#58585C"/>
      <stop offset="50%" stop-color="#48484C"/>
      <stop offset="85%" stop-color="#58585C"/>
      <stop offset="100%" stop-color="#6E6E73"/>
    </linearGradient>
    <linearGradient id="btnL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#6E6E73"/>
      <stop offset="40%" stop-color="#58585C"/>
      <stop offset="100%" stop-color="#48484C"/>
    </linearGradient>
    <linearGradient id="btnR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E6E73"/>
      <stop offset="40%" stop-color="#58585C"/>
      <stop offset="100%" stop-color="#48484C"/>
    </linearGradient>
  </defs>

  <!-- Titanium frame -->
  <rect x="0" y="0" width="430" height="932" rx="52" ry="52" fill="url(#titaniumSide)"/>
  <rect x="0" y="0" width="430" height="932" rx="52" ry="52" fill="url(#titaniumEdge)" opacity="0.5"/>
  <rect x="2" y="2" width="426" height="928" rx="50" ry="50" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>

  <!-- Front glass -->
  <rect x="5" y="5" width="420" height="922" rx="48" ry="48" fill="#0C0C0E"/>

  <!-- Screen -->
  <rect x="18" y="38" width="394" height="856" rx="28" ry="28" fill="#000"/>

  <!-- Dynamic Island -->
  <rect x="177" y="48" width="76" height="22" rx="11" ry="11" fill="#0C0C0E"/>

  <!-- Left buttons: silent switch -->
  <rect x="-1.5" y="163" width="5" height="22" rx="2" ry="2" fill="url(#btnL)"/>
  <!-- Volume up -->
  <rect x="-1.5" y="246" width="5" height="44" rx="2" ry="2" fill="url(#btnL)"/>
  <!-- Volume down -->
  <rect x="-1.5" y="300" width="5" height="44" rx="2" ry="2" fill="url(#btnL)"/>

  <!-- Right button: power -->
  <rect x="426.5" y="275" width="5" height="64" rx="2" ry="2" fill="url(#btnR)"/>
</svg>
