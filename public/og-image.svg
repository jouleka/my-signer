<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Brand gradient: deep ink violet → bright lavender (mirrors my-signer-dark primary) -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E3FB5"/>
      <stop offset="100%" stop-color="#BF9CE5"/>
    </linearGradient>
    <!-- Warm dark background, matching base-100 → base-200 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18130F"/>
      <stop offset="100%" stop-color="#221A14"/>
    </linearGradient>
    <radialGradient id="halo" cx="78%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#BF9CE5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#BF9CE5" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Star path used in the rating cards -->
    <symbol id="star" viewBox="0 0 12 12">
      <path d="M6 0.5l1.6 3.4 3.7.4-2.8 2.6.8 3.7L6 8.7 2.7 10.6l.8-3.7L0.7 4.3l3.7-.4z" fill="#E8C56A"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Subtle vertical rule (editorial) -->
  <line x1="540" y1="60" x2="540" y2="570" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ── LEFT BLOCK ─────────────────────────────────────────────────── -->
  <g transform="translate(80, 110)">

    <!-- Editorial section rail -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3.5" fill="#fff" opacity="0.55">№ 01</text>
      <line x1="58" y1="-5" x2="118" y2="-5" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
      <text x="128" y="0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3.5" fill="#fff" opacity="0.55">DASHBOARD + CLI</text>
    </g>

    <!-- Logo + brand name -->
    <g transform="translate(0, 36)">
      <circle cx="22" cy="22" r="22" fill="url(#brand)"/>
      <path d="M11 25c3-6 7-10 11-10 3 0 4 3 1.5 5.5s-5.5 5.5-2.5 5.5c4 0 8-4 9.5-7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="30" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#fff" letter-spacing="-0.5">MySigner</text>
    </g>

    <!-- Headline: serif italic for the editorial accent on "one tab." -->
    <text x="0" y="170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="-1.5">
      Five tools,
    </text>
    <text x="0" y="240" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif" font-style="italic" font-size="62" font-weight="500" fill="url(#brand)" letter-spacing="-1.5">
      one tab.
    </text>

    <!-- Subtitle -->
    <text x="0" y="298" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#fff" opacity="0.62">
      CLI ships your build. Dashboard handles screenshots,
    </text>
    <text x="0" y="326" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#fff" opacity="0.62">
      keywords, reviews, and analytics. From $12/mo.
    </text>

    <!-- Pills -->
    <g transform="translate(0, 372)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13">
      <g>
        <rect x="0"   y="0" width="74"  height="32" rx="16" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
        <text x="37"  y="20" fill="#fff" opacity="0.78" text-anchor="middle">iOS</text>
      </g>
      <g>
        <rect x="86"  y="0" width="100" height="32" rx="16" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
        <text x="136" y="20" fill="#fff" opacity="0.78" text-anchor="middle">Android</text>
      </g>
      <g>
        <rect x="198" y="0" width="158" height="32" rx="16" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
        <text x="277" y="20" fill="#fff" opacity="0.78" text-anchor="middle">macOS · Linux · Win</text>
      </g>
    </g>

    <!-- URL -->
    <text x="0" y="460" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#fff" opacity="0.45">mysigner.dev</text>
  </g>

  <!-- ── RIGHT BLOCK: dashboard bento (4 cards) ─────────────────────── -->
  <g transform="translate(620, 90)" filter="url(#cardShadow)">

    <!-- Card 1: Reviews — large hero card -->
    <g transform="translate(0, 0)">
      <rect width="500" height="220" rx="16" fill="#221A14" stroke="#fff" stroke-opacity="0.07"/>
      <text x="22" y="38" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#fff" opacity="0.45">REVIEWS · 7-DAY</text>

      <!-- Big rating -->
      <text x="22" y="92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#fff" letter-spacing="-1">4.8</text>
      <use href="#star" x="98"  y="62" width="20" height="20"/>
      <use href="#star" x="124" y="62" width="20" height="20"/>
      <use href="#star" x="150" y="62" width="20" height="20"/>
      <use href="#star" x="176" y="62" width="20" height="20"/>
      <use href="#star" x="202" y="62" width="20" height="20"/>
      <text x="98" y="94" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fff" opacity="0.5">54 reviews · App Store + Play</text>

      <!-- Sample review -->
      <line x1="22" y1="118" x2="478" y2="118" stroke="#fff" stroke-opacity="0.08"/>
      <use href="#star" x="22"  y="135" width="11" height="11"/>
      <use href="#star" x="36"  y="135" width="11" height="11"/>
      <use href="#star" x="50"  y="135" width="11" height="11"/>
      <use href="#star" x="64"  y="135" width="11" height="11"/>
      <use href="#star" x="78"  y="135" width="11" height="11"/>
      <text x="98" y="146" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fff" opacity="0.7" font-weight="600">Best notes app I've used in years.</text>
      <text x="22" y="172" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#fff" opacity="0.45">Sync just works. No fiddling. Replaced 3 other apps with this.</text>

      <!-- Reply chip -->
      <rect x="22" y="186" width="58" height="22" rx="11" fill="#6E3FB5" fill-opacity="0.22" stroke="#BF9CE5" stroke-opacity="0.35"/>
      <text x="51" y="201" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#BF9CE5" text-anchor="middle">REPLIED</text>
      <text x="92" y="201" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#fff" opacity="0.4">2h ago</text>
    </g>

    <!-- Card 2: Keyword rank -->
    <g transform="translate(0, 240)">
      <rect width="240" height="200" rx="16" fill="#221A14" stroke="#fff" stroke-opacity="0.07"/>
      <text x="20" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#fff" opacity="0.45">KEYWORD · US</text>
      <text x="20" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#fff">notes app</text>

      <!-- Big rank with delta -->
      <text x="20" y="116" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#fff">#12</text>
      <text x="100" y="116" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" font-weight="700" fill="#7BC97B">▲ 6</text>

      <!-- Tiny sparkline -->
      <polyline points="20,170 50,168 80,160 110,155 140,148 170,140 200,138 220,136"
                fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="220" cy="136" r="3.5" fill="#BF9CE5"/>
    </g>

    <!-- Card 3: Analytics installs -->
    <g transform="translate(260, 240)">
      <rect width="240" height="200" rx="16" fill="#221A14" stroke="#fff" stroke-opacity="0.07"/>
      <text x="20" y="32" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#fff" opacity="0.45">INSTALLS · 30D</text>
      <text x="20" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#fff">12,430</text>
      <text x="20" y="92" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#7BC97B">▲ 18.2%</text>

      <!-- Mini bar chart -->
      <g transform="translate(20, 110)">
        <rect x="0"   y="50" width="14" height="20" rx="2" fill="#BF9CE5" fill-opacity="0.45"/>
        <rect x="20"  y="42" width="14" height="28" rx="2" fill="#BF9CE5" fill-opacity="0.55"/>
        <rect x="40"  y="34" width="14" height="36" rx="2" fill="#BF9CE5" fill-opacity="0.6"/>
        <rect x="60"  y="36" width="14" height="34" rx="2" fill="#BF9CE5" fill-opacity="0.55"/>
        <rect x="80"  y="22" width="14" height="48" rx="2" fill="#BF9CE5" fill-opacity="0.7"/>
        <rect x="100" y="16" width="14" height="54" rx="2" fill="#BF9CE5" fill-opacity="0.78"/>
        <rect x="120" y="10" width="14" height="60" rx="2" fill="#BF9CE5" fill-opacity="0.85"/>
        <rect x="140" y="4"  width="14" height="66" rx="2" fill="url(#brand)"/>
        <rect x="160" y="14" width="14" height="56" rx="2" fill="#BF9CE5" fill-opacity="0.78"/>
        <rect x="180" y="0"  width="14" height="70" rx="2" fill="url(#brand)"/>
      </g>
    </g>

    <!-- Card 4: CLI ribbon (full width below) -->
    <g transform="translate(0, 460)">
      <rect width="500" height="76" rx="16" fill="#0f0c0a" stroke="#fff" stroke-opacity="0.06"/>
      <circle cx="22" cy="26" r="5" fill="#ff5f57" opacity="0.85"/>
      <circle cx="40" cy="26" r="5" fill="#febc2e" opacity="0.85"/>
      <circle cx="58" cy="26" r="5" fill="#28c840" opacity="0.85"/>
      <text x="22" y="60" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#BF9CE5">$
        <tspan fill="#fff" opacity="0.92"> mysigner ship appstore</tspan>
        <tspan fill="#7BC97B"> ✓ submitted</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#brand)"/>
</svg>
