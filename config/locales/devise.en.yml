# Additional translations at https://github.com/heartcombo/devise/wiki/I18n

en:
  devise:
    confirmations:
      confirmed: "✅ Email confirmed successfully! Welcome to MySigner."
      send_instructions: "📧 Confirmation instructions sent! Check your email in a few minutes."
      send_paranoid_instructions: "📧 If your email exists, you'll receive confirmation instructions shortly."
      new:
        title: "Resend confirmation"
        email_label: "Email"
        email_placeholder: "Enter your email address"
        email_hint: "Enter a valid email address"
        submit: "Resend confirmation"
    failure:
      already_authenticated: "You are already signed in."
      inactive: "Your account is not activated yet."
      invalid: "Invalid %{authentication_keys} or password."
      locked: "Your account is locked."
      last_attempt: "You have one more attempt before your account is locked."
      not_found_in_database: "Invalid %{authentication_keys} or password."
      # Mirror not_found_in_database verbatim. Returning a distinct string
      # would be an oracle for "this email is in its 90-day deletion
      # window" -- valuable signal for an attacker phishing the
      # restoration email. The legitimate path back is the link in the
      # account_pending_deletion email; users who lost it can contact
      # support, who can call User#regenerate_deletion_token!.
      pending_deletion: "Invalid %{authentication_keys} or password."
      timeout: "Your session expired. Please sign in again to continue."
      unauthenticated: "You need to sign in or sign up before continuing."
      unconfirmed: "You have to confirm your email address before continuing."
    mailer:
      confirmation_instructions:
        subject: "Confirmation instructions"
        greeting: "Welcome %{email}!"
        instruction: "You can confirm your account email through the link below:"
        cta: "Confirm my account"
      reset_password_instructions:
        subject: "Reset password instructions"
        greeting: "Hello %{email}!"
        instruction: "Someone has requested a link to change your password. You can do this through the link below."
        cta: "Change my password"
        ignore_text: "If you didn't request this, please ignore this email."
        no_change_text: "Your password won't change until you access the link above and create a new one."
      unlock_instructions:
        subject: "Unlock instructions"
        greeting: "Hello %{email}!"
        reason: "Your account has been locked due to an excessive number of unsuccessful sign in attempts."
        instruction: "Click the link below to unlock your account:"
        cta: "Unlock my account"
      email_changed:
        subject: "Email Changed"
        greeting: "Hello %{email}!"
        pending_change_html: "We're contacting you to notify you that your email is being changed to %{new_email}."
        changed_html: "We're contacting you to notify you that your email has been changed to %{new_email}."
      password_change:
        subject: "Password Changed"
        greeting: "Hello %{email}!"
        body: "We're contacting you to notify you that your password has been changed."
