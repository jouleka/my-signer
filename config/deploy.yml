# Name of your application. Used to uniquely configure containers.
service: my-signer

# Name of the container image.
image: <%= ENV.fetch("KAMAL_IMAGE") %>

# Deploy to these servers.
servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Note: If using Cloudflare, set SSL/TLS encryption mode to "Full (strict)" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: mysigner.dev

# Credentials for your image host.
registry:
  # Using Docker Hub (default). For GitHub Container Registry, use: server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - DATABASE_URL
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    # Optional during in-flight keyring rotation (mysigner-33). Holds the
    # OLD primary key value so Rails AR encryption can still decrypt rows
    # wrapped under it while new writes go under the current primary.
    # Empty / unset in steady state; populated only during rotation.
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY_PREVIOUS
    # Optional during in-flight DETERMINISTIC keyring rotation (follow-up
    # to mysigner-33). Same shape as PRIMARY_KEY_PREVIOUS but for the
    # deterministic key. Empty / unset in steady state.
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY_PREVIOUS
    - PADDLE_API_KEY
    - PADDLE_CLIENT_SIDE_TOKEN
    - PADDLE_WEBHOOK_SECRET
    - OPENAI_API_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - MYSIGNER_KMS_KEY_ARN
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of cores available to the application on each server (default: 1).
    WEB_CONCURRENCY: 2

    # Puma threads per worker. 3 is the Rails-recommended GVL-efficiency
    # default. Also sizes the cache DB pool via database.yml; the primary
    # and queue DBs have their own explicit pool env vars below because they
    # have different concurrency demands than Puma.
    RAILS_MAX_THREADS: 3

    # Primary DB pool, sized to Puma threads (3) + Sync::ParallelFanout's
    # inner thread pool (up to SYNC_FANOUT_THREADS, default 6 — see
    # app/services/sync/parallel_fanout.rb:18). Every fanout thread calls
    # `with_connection`, so the pool must cover them or sync jobs raise
    # ActiveRecord::ConnectionTimeoutError. 10 = 3 + 6 + 1 buffer.
    PRIMARY_DB_POOL: 10

    # Queue DB pool. Solid Queue's boot check sums threads across ALL worker
    # blocks in config/queue.yml (4 + 2 + 1 = 7) and compares to this pool.
    # 8 gives headroom for the supervisor/dispatcher internal queries. If
    # this is too small, Solid Queue refuses to boot and (because
    # SOLID_QUEUE_IN_PUMA=true) takes Puma down with it.
    QUEUE_DB_POOL: 8

    # Application
    # NOTE: Read by config/initializers/base_url.rb; that initializer raises
    # at boot if this env var is unset in production. Keep the var name in
    # sync with the initializer (BASE_URL, not APP_BASE_URL).
    BASE_URL: https://mysigner.dev

    # Active Storage service. "local" persists to the my_signer_storage volume mounted at /rails/storage.
    # Switch to "amazon" once S3 credentials are added to Rails encrypted credentials.
    ACTIVE_STORAGE_SERVICE: local

    # CredentialVault DEK cache version. Bump this integer to invalidate
    # the entire DEK cache during an incident response (mysigner-31).
    # Solid Cache doesn't implement `delete_matched`, so versioned keys
    # are how we purge without nuking unrelated cache state. Default "1";
    # never go backwards.
    MYSIGNER_DEK_CACHE_VERSION: "1"

    # Paddle Billing (production/live)
    BILLING_PROVIDER: paddle
    PADDLE_ENV: live
    PADDLE_PRODUCT_ID: pro_01kmj7dwbydcb7tq19en9jbg7q
    PADDLE_PRO_MONTHLY_PRICE_ID: pri_01kmj7rb719cwr88jc4dpzpt1v
    PADDLE_PRO_YEARLY_PRICE_ID: pri_01kmj7v1zr0fheznq4hgqwprbr
    PADDLE_TEAM_MONTHLY_PRICE_ID: pri_01kmj7w58v3rgvkjbzhh7d6z4r
    PADDLE_TEAM_YEARLY_PRICE_ID: pri_01kmj7xdv719v6ng2f02fsc3jr

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Use a persistent storage volume for Active Storage files.
volumes:
  - "my_signer_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64
  # If building on Apple Silicon (M1/M2/M3), you may want to use a remote builder
  # or enable multi-platform builds for faster builds:
  # multiarch: false

# PostgreSQL database accessory
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: my_signer
        POSTGRES_DB: my_signer_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
