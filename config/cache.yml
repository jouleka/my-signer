default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    # Sized for the KeywordChecker 6-hour MZStore cache. Math: ~500 Pro orgs ×
    # 20 kw × 3 countries × 300 KB/response ≈ 9 GB at full scale. 2 GB covers
    # ~100 active orgs comfortably; raise further as the feature grows. LRU
    # eviction is fine because access tokens (55min TTL, small) won't compete
    # much with rank cache (6h TTL, large).
    max_size: <%= 2.gigabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
